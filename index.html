<style>
/* Layout: tablero analítico — barra de filtros fija, fila de KPIs, grilla de fichas que colapsa a una columna */
:root {
  --bg: #F4F7FB;
  --surface: #FFFFFF;
  --surface-2: #EDF2F9;
  --line: #D5E0EF;
  --line-soft: #E6ECF5;
  --fg: #0F2238;
  --fg-mute: #5C6E88;
  --fg-faint: #8494A9;
  --brand: #0B2E59;
  --brand-2: #1F4E8C;
  --brand-3: #2E75B6;
  --accent: #B35F33;
  --good: #2F7D5B;
  --warn: #B07B18;
  --shadow: 0 1px 2px rgba(15,34,56,.06), 0 8px 24px -12px rgba(15,34,56,.18);
  --radius: 10px;
  --f-display: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-num: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1322;
    --surface: #111E31;
    --surface-2: #17263C;
    --line: #27384F;
    --line-soft: #1D2D44;
    --fg: #E7EFF9;
    --fg-mute: #9DB0C7;
    --fg-faint: #76889F;
    --brand: #C8DCF2;
    --brand-2: #5B9BE0;
    --brand-3: #78B4E8;
    --accent: #DE9163;
    --good: #5BBB8E;
    --warn: #DCB253;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1322;
  --surface: #111E31;
  --surface-2: #17263C;
  --line: #27384F;
  --line-soft: #1D2D44;
  --fg: #E7EFF9;
  --fg-mute: #9DB0C7;
  --fg-faint: #76889F;
  --brand: #C8DCF2;
  --brand-2: #5B9BE0;
  --brand-3: #78B4E8;
  --accent: #DE9163;
  --good: #5BBB8E;
  --warn: #DCB253;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 1280px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface);
}

/* ---- cabecera ---- */
.head {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 19;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 12px;
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px 20px;
}
.head h1 {
  font-family: var(--f-display); font-weight: 700; font-size: 20px;
  letter-spacing: -.015em; margin: 0; line-height: 1.15; color: var(--fg);
  text-wrap: balance;
}
.head .sub { color: var(--fg-mute); font-size: 12.5px; margin-top: 2px; }
.head .grow { flex: 1 1 180px; min-width: 0; }

.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button {
  font: 500 12.5px/1 var(--f-body); color: var(--fg-mute);
  background: none; border: 0; border-radius: 6px; padding: 7px 13px; cursor: pointer;
  white-space: nowrap;
}
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--brand-2); color: #fff; font-weight: 600; }
.seg button:focus-visible { outline: 2px solid var(--brand-3); outline-offset: 1px; }
.fld { display: flex; flex-direction: column; gap: 5px; }
.fld > span { font: 600 10px/1 var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--fg-faint); }

/* ---- KPIs ---- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(205px, 1fr)); gap: 12px; margin-top: 20px; }
.kpi {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px 15px; box-shadow: var(--shadow); min-width: 0;
  display: flex; flex-direction: column; gap: 3px;
  border-top: 3px solid var(--kpi, var(--brand-2));
}
.kpi .lbl { font: 600 10px/1.3 var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--fg-faint); }
.kpi .val {
  font-family: var(--f-num); font-weight: 600; font-size: 25px; letter-spacing: -.02em;
  font-variant-numeric: tabular-nums; color: var(--fg); line-height: 1.15;
}
.kpi .val small { font-size: 13px; font-weight: 500; color: var(--fg-mute); margin-right: 3px; }
.kpi .note { font-size: 11.5px; color: var(--fg-mute); line-height: 1.35; }
.kpi .note b { font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums; }
.up { color: var(--good); font-weight: 600; }
.down { color: var(--accent); font-weight: 600; }

/* ---- fichas ---- */
.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; margin-top: 12px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 15px 16px 12px; grid-column: span 12; min-width: 0;
}
.card.half { grid-column: span 6; }
@media (max-width: 860px) { .card.half { grid-column: span 12; } }
.card > header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 2px; }
.card h2 {
  font-family: var(--f-display); font-weight: 600; font-size: 14.5px; letter-spacing: -.005em;
  margin: 0; color: var(--fg);
}
.card .hint { font-size: 11.5px; color: var(--fg-mute); flex: 1 1 160px; min-width: 0; }
.chartbox { margin-top: 10px; width: 100%; }
.recharts-wrapper { font-family: var(--f-body); }

.toggle {
  display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
  font-size: 11.5px; color: var(--fg-mute); user-select: none; white-space: nowrap;
}
.toggle input { accent-color: var(--brand-2); width: 14px; height: 14px; margin: 0; cursor: pointer; }

/* ---- tooltip ---- */
.tip {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 9px 11px; box-shadow: var(--shadow); font-size: 12px; min-width: 150px;
}
.tip .t-h { font-weight: 600; color: var(--fg); margin-bottom: 5px; font-size: 12px; }
.tip .t-r { display: flex; align-items: center; gap: 7px; justify-content: space-between; padding: 1.5px 0; }
.tip .t-n { display: flex; align-items: center; gap: 6px; color: var(--fg-mute); min-width: 0; }
.tip .t-v { font-family: var(--f-num); font-variant-numeric: tabular-nums; color: var(--fg); font-weight: 500; }
.dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.tip .t-f { margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--line-soft); }

/* ---- heatmap ---- */
.hm { margin-top: 12px; overflow-x: auto; }
.hm-in { min-width: 560px; }
.hm-row { display: grid; grid-template-columns: 46px repeat(12, 1fr); gap: 3px; align-items: center; }
.hm-row + .hm-row { margin-top: 3px; }
.hm-y { font: 600 11px/1 var(--f-num); color: var(--fg-mute); font-variant-numeric: tabular-nums; }
.hm-m { font: 600 10px/1 var(--f-body); color: var(--fg-faint); text-align: center; letter-spacing: .04em; padding-bottom: 4px; }
.hm-c {
  aspect-ratio: 1.9 / 1; border-radius: 4px; cursor: default; border: 1px solid transparent;
  display: flex; align-items: center; justify-content: center;
  font: 500 10px/1 var(--f-num); font-variant-numeric: tabular-nums;
}
.hm-c.fut { background: repeating-linear-gradient(45deg, var(--surface-2), var(--surface-2) 4px, transparent 4px, transparent 8px); border-color: var(--line-soft); }
.hm-c:hover { border-color: var(--fg); }
.hm-leg { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 11px; color: var(--fg-mute); flex-wrap: wrap; }
.hm-bar { display: flex; gap: 2px; }
.hm-bar i { width: 20px; height: 9px; border-radius: 2px; display: block; }

.tbl { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12.5px; }
.tbl th { text-align: left; font: 600 10px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-faint); padding: 0 8px 6px 0; border-bottom: 1px solid var(--line); }
.tbl td { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line-soft); }
.tbl td.n { font-family: var(--f-num); font-variant-numeric: tabular-nums; text-align: right; }
.tbl tr:last-child td { border-bottom: 0; }

.notes {
  margin-top: 16px; background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px 16px; font-size: 12px; color: var(--fg-mute);
}
.notes h3 { font: 600 11px/1 var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--fg-faint); margin: 0 0 8px; }
.notes ul { margin: 0; padding-left: 17px; display: flex; flex-direction: column; gap: 5px; }
.notes b { color: var(--fg); font-weight: 600; }
.notes .flag { color: var(--accent); font-weight: 600; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<script>var DATA = []; /* se completa al cargar datos.json vía fetch */</script>
<script>
(function () {
  var h = React.createElement;
  var useState = React.useState, useMemo = React.useMemo, useEffect = React.useEffect;
  var R = Recharts;

  var PAL_L = ['#1F4E8C', '#2E9BD6', '#B35F33', '#3C8C69', '#7F63AB', '#C09428', '#AF5167', '#67778D'];
  var PAL_D = ['#5B9BE0', '#55C6F0', '#E09263', '#58BB8D', '#AC91D4', '#E0BC55', '#DC8096', '#94A5BB'];

  var nf0 = new Intl.NumberFormat('es-UY', { maximumFractionDigits: 0 });

    }
    useEffect(function () {
      var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

      var ob = new MutationObserver(on);

      return function () { if (mq && mq.removeEventListener) mq.removeEventListener('change', on); ob.disconnect(); };
    }, []);

  }

  function Tip(props) {

    return h('div', { className: 'tip' },

      h('header', null, h('h2', null, p.title), p.hint ? h('p', { className: 'hint' }, p.hint) : null, p.action || null),
      p.children);
  }

  /* ---------- Evolución mensual ---------- */
  function Evolucion(p) {
    var pal = p.pal;
    var ev = useMemo(function () { return evolucion(DATA, p.year, 5); }, [p.year]);
    var porAnio = p.year === 'all';
    return h('div', { className: 'chartbox', style: { height: 320 } },
      h(R.ResponsiveContainer, { width: '100%', height: '100%' },
        h(R.LineChart, { data: ev.filas, margin: { top: 8, right: 14, left: 4, bottom: 4 } },

          h(R.Tooltip, { content: h(Tip, null), cursor: { stroke: p.grid, strokeWidth: 1 } }),
          h(R.Legend, { wrapperStyle: { fontSize: 11.5, color: p.mute, paddingTop: 8 }, iconType: 'plainline', iconSize: 14 }),
          ev.series.map(function (s, i) {
            return h(R.Line, {
              key: s, type: 'monotone', dataKey: s, name: porAnio ? s : s,
              stroke: s === 'Otros' ? p.faint : pal[i % pal.length],
              strokeWidth: porAnio ? 2.4 : (i === 0 ? 2.4 : 1.7),
              strokeDasharray: s === 'Otros' ? '4 3' : undefined,
              dot: { r: 2.4, strokeWidth: 0, fill: s === 'Otros' ? p.faint : pal[i % pal.length] },
              activeDot: { r: 4.5 }, connectNulls: true, isAnimationActive: false
            });
          }))));
  }

  /* ---------- Mercadería ---------- */
  function Mercaderia(p) {
    var datos = useMemo(function () {
      return porMercaderia(DATA, p.year, p.varios, 14).map(function (d) { return d; }).reverse();
    }, [p.year, p.varios]);
    var alto = Math.max(230, datos.length * 26 + 30);
    return h('div', { className: 'chartbox', style: { height: alto } },
      h(R.ResponsiveContainer, { width: '100%', height: '100%' },
        h(R.BarChart, { data: datos, layout: 'vertical', margin: { top: 4, right: 58, left: 4, bottom: 4 } },
          h(R.CartesianGrid, { stroke: p.grid, strokeDasharray: '2 4', horizontal: false }),
          h(R.XAxis, { type: 'number', tickFormatter: compact, tick: { fill: p.mute, fontSize: 11 }, tickLine: false, axisLine: { stroke: p.grid } }),
          h(R.YAxis, {
            type: 'category', dataKey: 'merc', width: 148, tickLine: false, axisLine: false,
            tick: { fill: p.fg, fontSize: 11 }, interval: 0
          }),
          h(R.Tooltip, {
            cursor: { fill: p.hover },
            content: function (o) {
              if (!o.active || !o.payload || !o.payload.length) return null;
              var d = o.payload[0].payload;
              return h('div', { className: 'tip' },
                h('div', { className: 't-h' }, d.merc),
                h('div', { className: 't-r' }, h('span', { className: 't-n' }, 'Importe'), h('span', { className: 't-v' }, 'USD ' + money(d.valor))),
                h('div', { className: 't-r' }, h('span', { className: 't-n' }, 'Facturas'), h('span', { className: 't-v' }, d.n)),
                h('div', { className: 't-r t-f' }, h('span', { className: 't-n' }, 'Categoría'), h('span', { className: 't-v' }, d.clase)));
            }
          }),
          h(R.Bar, {
            dataKey: 'valor', name: 'Importe', radius: [0, 3, 3, 0], barSize: 15, isAnimationActive: false
          },
            datos.map(function (d, i) {
              return h(R.Cell, { key: i, fill: d.tipo === 'Varios – Dr. Lazar' ? p.pal[0] : (d.tipo === 'Principio activo' ? p.pal[1] : p.pal[2]) });
            }),
            h(R.LabelList, {
              dataKey: 'valor', position: 'right', formatter: compact,
              style: { fill: p.mute, fontSize: 10.5, fontFamily: "'IBM Plex Mono', monospace" }
            })))));
  }

  /* ---------- Mix por tipo (donut) ---------- */
  function MixTipo(p) {
    var datos = useMemo(function () { return porTipo(DATA, p.year); }, [p.year]);
    var total = datos.reduce(function (s, d) { return s + d.value; }, 0);
    return h('div', null,
      h('div', { className: 'chartbox', style: { height: 212, position: 'relative' } },
        h(R.ResponsiveContainer, { width: '100%', height: '100%' },
          h(R.PieChart, { margin: { top: 0, right: 0, left: 0, bottom: 0 } },
            h(R.Pie, {
              data: datos, dataKey: 'value', nameKey: 'name',

                  h('div', { className: 't-r' }, h('span', { className: 't-n' }, 'Peso'), h('span', { className: 't-v' }, nf1.format(d.pct) + ' %')),

            }))),
        h('div', {
          style: {
            position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column',

          }
        },
          h('div', { style: { fontSize: 17, fontWeight: 600, letterSpacing: '-.02em', color: 'var(--fg)' } }, compact(total)),
          h('div', { style: { fontSize: 10, color: 'var(--fg-faint)', letterSpacing: '.08em', fontFamily: "var(--f-body)", textTransform: 'uppercase', marginTop: 1 } }, 'USD total'))),
      h('table', { className: 'tbl' },
        h('thead', null, h('tr', null,
          h('th', null, 'Categoría'), h('th', { style: { textAlign: 'right' } }, 'USD'), h('th', { style: { textAlign: 'right' } }, 'Peso'))),
        h('tbody', null, datos.map(function (d, i) {
          return h('tr', { key: d.name },
            h('td', null, h('span', { style: { display: 'inline-flex', alignItems: 'center', gap: 7 } },
              h('i', { className: 'dot', style: { background: p.pal[i % p.pal.length] } }), d.name)),
            h('td', { className: 'n' }, money(d.value)),

        }))));
  }

  /* ---------- Clases terapéuticas ---------- */
  function Clases(p) {
    var datos = useMemo(function () { return porClase(DATA, p.year); }, [p.year]);
    if (!datos.length) return h('p', { className: 'hint', style: { marginTop: 12 } }, 'Sin principios activos en el período.');
    var alto = Math.max(200, datos.length * 30 + 34);
    return h('div', { className: 'chartbox', style: { height: alto } },
      h(R.ResponsiveContainer, { width: '100%', height: '100%' },
        h(R.BarChart, { data: datos, layout: 'vertical', margin: { top: 4, right: 62, left: 4, bottom: 4 } },
          h(R.CartesianGrid, { stroke: p.grid, strokeDasharray: '2 4', horizontal: false }),
          h(R.XAxis, { type: 'number', tickFormatter: compact, tick: { fill: p.mute, fontSize: 11 }, tickLine: false, axisLine: { stroke: p.grid } }),
          h(R.YAxis, { type: 'category', dataKey: 'clase', width: 142, tickLine: false, axisLine: false, tick: { fill: p.fg, fontSize: 11 }, interval: 0 }),
          h(R.Tooltip, {
            cursor: { fill: p.hover },
            content: function (o) {
              if (!o.active || !o.payload || !o.payload.length) return null;
              var d = o.payload[0].payload;
              return h('div', { className: 'tip' },
                h('div', { className: 't-h' }, d.clase),
                h('div', { className: 't-r' }, h('span', { className: 't-n' }, 'Importe'), h('span', { className: 't-v' }, 'USD ' + money(d.valor))),
                h('div', { className: 't-r' }, h('span', { className: 't-n' }, 'Sobre API'), h('span', { className: 't-v' }, nf1.format(d.pct) + ' %')),
                h('div', { className: 't-r' }, h('span', { className: 't-n' }, 'Facturas'), h('span', { className: 't-v' }, d.n)));
            }
          }),
          h(R.Bar, { dataKey: 'valor', radius: [0, 3, 3, 0], barSize: 17, isAnimationActive: false },
            datos.map(function (d, i) { return h(R.Cell, { key: i, fill: p.pal[(i + 1) % p.pal.length] }); }),
            h(R.LabelList, {
              dataKey: 'pct', position: 'right',
              formatter: function (v) { return nf1.format(v) + ' %'; },
              style: { fill: p.mute, fontSize: 10.5, fontFamily: "'IBM Plex Mono', monospace" }
            })))));
  }

  /* ---------- Estacionalidad ---------- */
  function Estacionalidad(p) {
    var est = useMemo(function () { return estacionalidad(DATA); }, []);
    var hov = useState(null), sel = hov[0], setSel = hov[1];
    function tono(c) {
      if (c.futuro) return null;
      var r = est.max ? c.valor / est.max : 0;
      var a = 0.08 + Math.pow(r, 0.62) * 0.92;
      return p.dark
        ? 'rgba(91,155,224,' + a.toFixed(3) + ')'
        : 'rgba(31,78,140,' + a.toFixed(3) + ')';
    }
    function texto(c) {
      if (c.futuro) return 'transparent';
      var r = est.max ? c.valor / est.max : 0;
      if (p.dark) return r > 0.55 ? '#071220' : 'var(--fg-mute)';
      return r > 0.5 ? '#fff' : 'var(--fg-mute)';
    }
    return h('div', null,
      h('div', { className: 'hm' },
        h('div', { className: 'hm-in' },
          h('div', { className: 'hm-row' },
            h('span', null),
            MESES.map(function (m) { return h('span', { className: 'hm-m', key: m }, m); })),
          est.matriz.map(function (fila) {
            return h('div', { className: 'hm-row', key: fila.anio },
              h('span', { className: 'hm-y' }, fila.anio),
              fila.celdas.map(function (c) {
                return h('div', {
                  key: c.mes,
                  className: 'hm-c' + (c.futuro ? ' fut' : ''),
                  style: { background: c.futuro ? undefined : tono(c), color: texto(c) },
                  onMouseEnter: function () { setSel(c); },
                  onMouseLeave: function () { setSel(null); },
                  title: c.futuro ? fila.anio + ' · ' + c.label + ': sin datos aún'
                    : fila.anio + ' · ' + c.label + ': USD ' + money(c.valor) + ' · ' + c.n + (c.n === 1 ? ' factura' : ' facturas')
                }, c.futuro ? '' : (c.valor ? compact(c.valor) : '–'));
              }));
          }))),
      h('div', { className: 'hm-leg' },
        h('span', null, 'Menor'),
        h('span', { className: 'hm-bar' }, [0.12, 0.3, 0.5, 0.72, 1].map(function (a, i) {
          return h('i', { key: i, style: { background: p.dark ? 'rgba(91,155,224,' + a + ')' : 'rgba(31,78,140,' + a + ')' } });
        })),
        h('span', null, 'Mayor (USD ' + money(est.max) + ')'),
        h('span', { style: { marginLeft: 'auto', color: 'var(--fg-faint)' } },
          sel ? (sel.futuro ? sel.anio + ' · ' + sel.label + ': sin datos aún'
            : sel.anio + ' · ' + sel.label + ' — USD ' + money(sel.valor) + ' en ' + sel.n + (sel.n === 1 ? ' factura' : ' facturas'))
            : 'Rayado: meses aún sin registrar')),
      h('div', { className: 'chartbox', style: { height: 170, marginTop: 14 } },
        h(R.ResponsiveContainer, { width: '100%', height: '100%' },
          h(R.BarChart, { data: est.medias, margin: { top: 6, right: 10, left: 4, bottom: 4 } },
            h(R.CartesianGrid, { stroke: p.grid, strokeDasharray: '2 4', vertical: false }),
            h(R.XAxis, { dataKey: 'mes', tick: { fill: p.mute, fontSize: 11 }, tickLine: false, axisLine: { stroke: p.grid } }),
            h(R.YAxis, { tickFormatter: compact, tick: { fill: p.mute, fontSize: 11 }, tickLine: false, axisLine: false, width: 52 }),
            h(R.Tooltip, {
              cursor: { fill: p.hover },
              content: function (o) {
                if (!o.active || !o.payload || !o.payload.length) return null;
                var d = o.payload[0].payload;
                return h('div', { className: 'tip' },
                  h('div', { className: 't-h' }, d.mes),
                  h('div', { className: 't-r' }, h('span', { className: 't-n' }, 'Media mensual'), h('span', { className: 't-v' }, 'USD ' + money(d.media))),
                  h('div', { className: 't-r t-f' }, h('span', { className: 't-n' }, 'Años promediados'), h('span', { className: 't-v' }, d.años)));
              }
            }),
            h(R.Bar, { dataKey: 'media', name: 'Media mensual', radius: [3, 3, 0, 0], isAnimationActive: false, maxBarSize: 46 },
              est.medias.map(function (d, i) {
                return h(R.Cell, { key: i, fill: d.años < 2 ? p.faint : (d.media >= 450000 ? p.pal[2] : p.pal[0]) });
              }))))),
      h('p', { className: 'hint', style: { marginTop: 4 } },
        'Marzo (USD ' + money(est.medias[2].media) + ') y agosto (USD ' + money(est.medias[7].media) +
        ') son los meses más cargados. Diciembre todavía promedia un solo año, porque 2026 no llegó a fin de año.'));
  }

  /* ---------- App ---------- */
  function App() {
    var a = useState('all'), year = a[0], setYear = a[1];
    var b = useState(false), varios = b[0], setVarios = b[1];
    var theme = useTheme();
    var le = useState('cargando'), estado = le[0], setEstado = le[1];
    useEffect(function () {
      var cancelado = false;
      fetch('datos.json')
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (json) {
          if (cancelado) return;
          DATA = json;
          setEstado('listo');
        })
        .catch(function (e) {
          if (cancelado) return;
          console.error('No se pudo cargar datos.json', e);
          setEstado('error');
        });
      return function () { cancelado = true; };
    }, []);
    var dark = theme === 'dark';
    var pal = dark ? PAL_D : PAL_L;
    var P = {
      pal: pal, dark: dark,
      grid: dark ? '#27384F' : '#D5E0EF',
      mute: dark ? '#9DB0C7' : '#5C6E88',
      faint: dark ? '#6A7D95' : '#9AA8BC',
      fg: dark ? '#E7EFF9' : '#0F2238',
      surface: dark ? '#111E31' : '#FFFFFF',
      hover: dark ? 'rgba(91,155,224,.10)' : 'rgba(31,78,140,.06)'
    };

    var k = useMemo(function () { return kpis(DATA, year); }, [year, estado]);
    var k25 = useMemo(function () { return kpis(DATA, '2025'); }, [estado]);
    var k26 = useMemo(function () { return kpis(DATA, '2026'); }, [estado]);
    var mayor = useMemo(function () {
      var f = filtrar(DATA, year).filter(function (r) { return r.mo === 'USD'; });
      return f.reduce(function (m, r) { return !m || r.v > m.v ? r : m; }, null);
    }, [year, estado]);

    var eneNov25 = useMemo(function () {
      return DATA.filter(function (r) { return r.mo === 'USD' && r.y === 2025 && r.mes <= 11; })
        .reduce(function (s, r) { return s + r.v; }, 0);
    }, [estado]);
    var varPct = ((k26.totUsd - eneNov25) / eneNov25) * 100;

    var notaUsd;
    if (year === 'all') {
      notaUsd = h('span', null, '2025: ', h('b', null, money(k25.totUsd)), ' · 2026: ', h('b', null, money(k26.totUsd)));
    } else if (year === '2026') {
      notaUsd = h('span', null, 'Enero-noviembre, ', h('span', { className: varPct >= 0 ? 'up' : 'down' }, (varPct >= 0 ? '+' : '') + nf1.format(varPct) + ' %'), ' contra igual período de 2025');
    } else {
      notaUsd = h('span', null, 'Año completo · factura mayor: ', h('b', null, money(mayor ? mayor.v : 0)),
        mayor ? ' (carpeta ' + mayor.c + ')' : '');
    }

    var titEvol = year === 'all'
      ? 'Dos curvas: el total mensual de cada año, para comparar 2025 con 2026.'
      : 'Los cinco proveedores de mayor importe del año; el resto se agrupa en «Otros».';

    /* Compras a terceros descontando la dipirona, que desde 2026 se compra en plaza */
    var sinDip = useMemo(function () {
      function calc(y) {
        return DATA.filter(function (r) {
          return r.mo === 'USD' && r.y === y && r.p !== 'DR. LAZAR' && r.m !== 'DIPIRONA SODICA';
        }).reduce(function (s, r) { return s + r.v; }, 0);
      }
      var a = calc(2025), b = calc(2026);
      return { a: a, b: b, pct: a ? ((b - a) / a) * 100 : 0 };
    }, [estado]);

    var notaTerceros;
    if (year === '2026') {
      notaTerceros = h('span', null, h('b', null, k.nTerceros), ' facturas · sin la dipirona, que pasó a plaza, ',
        h('span', { className: sinDip.pct >= 0 ? 'up' : 'down' }, (sinDip.pct >= 0 ? '+' : '') + nf1.format(sinDip.pct) + ' %'), ' contra 2025');
    } else {
      notaTerceros = h('span', null, h('b', null, k.nTerceros), ' facturas · promedio ',
        h('b', null, money(k.nTerceros ? k.terceros / k.nTerceros : 0)));
    }

    if (!DATA.length) {
      return h('div', { className: 'wrap', style: { paddingTop: 90, textAlign: 'center' } },
        estado === 'error'
          ? h('p', { className: 'hint' }, 'No se pudieron cargar los datos desde ', h('b', null, 'datos.json'), '. Verificá que el archivo esté publicado junto al tablero.')
          : h('p', { className: 'hint' }, 'Cargando datos…'));
    }

    return h('div', null,
      h('header', { className: 'head' },
        h('div', { className: 'grow' },
          h('h1', null, 'Importaciones Lazar'),
          h('p', { className: 'sub' }, '111 facturas · enero 2025 a noviembre 2026 · fuente: planilla Vencimientos')),
        h('div', { className: 'fld' },
          h('span', null, 'Año'),
          h('div', { className: 'seg', role: 'group', 'aria-label': 'Filtrar por año' },
            [['all', 'Ambos'], ['2025', '2025'], ['2026', '2026']].map(function (o) {
              return h('button', {
                key: o[0], type: 'button', id: 'yr-' + o[0],
                'aria-pressed': year === o[0] ? 'true' : 'false',
                onClick: function () { setYear(o[0]); }
              }, o[1]);
            })))),

      h('div', { className: 'wrap' },
        h('div', { className: 'kpis' },
          h(Kpi, {
            label: 'Importado en dólares', unit: 'USD', color: pal[0],
            value: money(k.totUsd), note: notaUsd
          }),
          h(Kpi, {
            label: 'Importado en euros', unit: 'EUR', color: pal[1],
            value: money(k.totEur),
            note: h('span', null, 'Solo estándares EDQM. Nunca convertidos a dólares.')
          }),
          h(Kpi, {
            label: 'Dr. Lazar (casa matriz)', unit: 'USD', color: pal[3],
            value: money(k.drLazar),
            note: h('span', null, h('b', null, nf1.format(k.drLazarPct) + ' %'), ' del total en dólares')
          }),
          h(Kpi, {
            label: 'Compras a terceros', unit: 'USD', color: pal[2],
            value: money(k.terceros), note: notaTerceros
          })),

        h('div', { className: 'grid' },
          h(Card, { title: 'Evolución mensual', hint: titEvol },
            h(Evolucion, Object.assign({ year: year }, P))),

          h(Card, {
            title: 'Comparativa por mercadería',
            hint: (varios ? 'Con los envíos «Varios» de Dr. Lazar, que absorben el resto de la escala.' : 'Principios activos, estándares y equipos. Los envíos «Varios» quedan fuera.')
              + (year === '2026' ? ' La dipirona no figura: desde 2026 se compra en plaza.' : ''),
            action: h('label', { className: 'toggle' },
              h('input', { type: 'checkbox', id: 'inc-varios', checked: varios, onChange: function (e) { setVarios(e.target.checked); } }),
              h('span', null, 'Incluir «Varios» de Dr. Lazar'))
          }, h(Mercaderia, Object.assign({ year: year, varios: varios }, P))),

          h(Card, { half: true, title: 'Mix por categoría', hint: 'Peso de cada tipo de mercadería sobre el total en dólares.' },
            h(MixTipo, Object.assign({ year: year }, P))),

          h(Card, { half: true, title: 'Clase terapéutica', hint: 'Reparto dentro de los principios activos, sin los envíos «Varios».' },
            h(Clases, Object.assign({ year: year }, P))),

          h(Card, {
            title: 'Estacionalidad',
            hint: 'Importes mensuales de ambos años y media por mes. No depende del filtro de año: compara los dos.'
          }, h(Estacionalidad, P))),

        h('div', { className: 'notes' },
          h('h3', null, 'Cómo se armaron estos números'),
          h('ul', null,
            h('li', null, 'Cada factura se cuenta una sola vez: la planilla Vencimientos lista un renglón por cuota, y acá se suman las cuotas de cada factura. El período es la ', h('b', null, 'fecha de la factura'), ', no la del vencimiento.'),
            h('li', null, 'Datos tomados de la planilla Vencimientos actualizada al ', h('b', null, '23/11/2026'), '.'),
            h('li', null, 'Dólares y euros van siempre separados, ', h('b', null, 'sin convertir'), '. Los euros son solo estándares EDQM.'),
            h('li', null, h('b', null, 'Dipirona sódica: '), 'desde 2026 se compra en plaza, así que deja de ser importación. Explica que WELDING no aparezca en 2026 y la caída de las compras a terceros. Descontada la dipirona de 2025, las compras a terceros ', h('b', null, 'suben 8,4 %'), ' (USD 463.224 contra USD 502.120).'),
            h('li', null, 'Las facturas ', h('b', null, 'SGD'), ' (sin giro de divisas) no están en Vencimientos porque no generan pago, así que quedan fuera de todo el tablero.'),
            h('li', null, '2026 llega hasta ', h('b', null, 'noviembre'), ': cualquier comparación anual se hace contra el mismo tramo de 2025.')))));
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
